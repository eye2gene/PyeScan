[project]
name = "pyescan"
version = "0.0.2"
description = "A Python library for working with retinal scans exported by Private Eye / Crystal Eye"
readme = "README.md"
requires-python = ">=3.12,<4.0"
license = "MIT"
authors = [{ name = "William Woof", email = "awwoof@hotmail.com" }]
maintainers = [{ name = "William Woof", email = "awwoof@hotmail.com" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = [
  "Pillow",
  "matplotlib",
  "numpy",
  "pandas",
  "rich",
  "tqdm",
  "typer",
]

[project.scripts]
pyescan = "pyescan.tools.cli:app"

[project.optional-dependencies]
all = [
  "pyescan[jupyter,registration,metrics]",
]
jupyter = [
  "ipython",
  "ipywidgets",
]
metrics = [
  "opencv-python",
  "scikit-image",
  "scipy",
]
registration = [
  "scipy",
]

[dependency-groups]
dev = [
  { include-group = "lint" },
  { include-group = "test" },
  { include-group = "tools" },
]
lint = [
  "licensecheck",
  "ruff",
]
test = [
  "ipdb",
  "pdbpp",
  "pytest",
  "pytest-cov",
  "pytest-xdist",
  "ty",
]
tools = ["cruft", "rust-just"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.coverage.report]
omit = ["__main__.py"]
fail_under = 50  # minimum coverage required, but aim for 100% though
exclude_also = [
  "if TYPE_CHECKING:",
  "if typing.TYPE_CHECKING:",
  "@overload",
  "@typing.overload",
  "class .*\\bProtocol\\):",
  "@(abc\\.)?abstractmethod",
  "raise NotImplementedError",
  "\\.\\.\\.",
  "no cov",
  "if __name__ == .__main__.:",
]

[tool.hatch.build.targets.sdist]
include = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/pyescan"]

[tool.pytest]
addopts = [
  "--cov-branch",
  "--cov-report=term-missing:skip-covered",
  "--cov-report=xml",
  "--cov=src/",
  "--cov=tests/",
  "--dist=loadscope",
  "--durations=5",
  "-n",
  "0"
]
filterwarnings = []
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
  "ANN",  # check typings
  "B",  # flake8-bugbear
  "D",  # check docstrings
  "E",  # pycodestyle errors
  "F",  # Pyflakes
  "I",  # isort
  "RUF",  # Ruff-specific rules
  "SIM",  # Common simplification rules
  "TC",  # Enforce importing certain types in a TYPE_CHECKING block
  "TD",  # Be diligent with TODO comments
  "TID",  # Some good import practices
  "UP",  # Warn if certain things can changed due to newer Python versions
  "W",  # PyCodeStyle warnings
  "S",  # security issues
]
ignore = [
  "E501",  # line length (handled by ruff format for code)
  "B008",  # function call in defaults (standard typer pattern)
  # Temporarily ignored during migration — to be addressed incrementally
  "ANN001",  # missing type annotation for function argument
  "ANN002",  # missing type annotation for *args
  "ANN003",  # missing type annotation for **kwargs
  "ANN201",  # missing return type annotation for public function
  "ANN202",  # missing return type annotation for private function
  "ANN204",  # missing return type annotation for special method
  "ANN206",  # missing return type annotation for classmethod
  "ANN401",  # use of typing.Any
  "D100",  # missing docstring in public module
  "D101",  # missing docstring in public class
  "D102",  # missing docstring in public method
  "D103",  # missing docstring in public function
  "D105",  # missing docstring in magic method
  "D107",  # missing docstring in __init__
  "D205",  # blank line required between summary and description
  "D415",  # first line should end with a period
  "RUF012",  # mutable class variable (needs ClassVar annotation)
  "RUF013",  # implicit Optional
  "TD002",  # missing author in TODO
  "TD003",  # missing issue link in TODO
  "TD004",  # missing colon in TODO
  "TD005",  # missing description in TODO
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "S"]  # ["UP", "RUF", "I", "D", "E501"]
"__main__.py" = ["D100"]
"__init__.py" = ["D104"]
"src/pyescan/tools/dataloading.py" = [
  "F821"
]  # legacy undefined names from incomplete refactor
"src/pyescan/core/annotation.py" = ["F821"]  # forward reference to BaseScan
"src/pyescan/metrics/__init__.py" = [
  "F403"
]  # star import is intentional public API
"src/pyescan/metrics/processor.py" = [
  "SIM116"
]  # if-chain is clearer than dict here

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
commit_message = "chore(release): {version}"

[tool.ty]
# All rules are enabled as "error" by default; no need to specify unless overriding.

[tool.ty.environment]
python = ".venv"

[tool.ty.src]
include = ["src"]

[tool.ty.terminal]
# TODO: re-enable once type annotations are added
# error-on-warning = true

[tool.uv]
exclude-newer = "7 days"
package = true
default-groups = ["dev"]
cache-keys = [
  { file = "pyproject.toml" },
  { git = { commit = true, tags = true } }
]
