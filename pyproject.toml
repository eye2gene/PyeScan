[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyescan"
version = "0.0.3"
description = "A library for working with retinal scans exported by PrivateEye/CrystalEye"
readme = "README.md"
license = "MIT"
authors = [
    { name = "William Woof", email = "awwoof@hotmail.com" },
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Software Development :: Libraries",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click",
    "numpy",
    "pandas",
    "matplotlib",
    "tqdm",
    "Pillow",
    "scikit-image",
]

[project.optional-dependencies]
interactive = [
    "ipywidgets",
    "IPython",
]
registration = [
    "retinalysis",
]
parallel = [
    "pathos",
]
dev = [
    "pytest",
    "pytest-cov",
]

[project.scripts]
summarise_ce_export = "pyescan.tools.cli:get_ce_export_summary_cli"
summarise_dataset = "pyescan.tools.cli:summarise_dataset_cli"
run_function_on_csv = "pyescan.tools.cli:run_function_on_csv_cli"
run_function_over_csv = "pyescan.tools.cli:run_function_over_csv_cli"
run_metric = "pyescan.tools.cli:run_metric_csv_cli"
narrow_to_wide = "pyescan.tools.cli:narrow_to_wide_cli"

[project.urls]
Repository = "https://github.com/pontikos-lab/PyeScan"

[tool.setuptools.packages.find]
include = ["pyescan*"]
exclude = ["dev*", "*.ipynb_checkpoints*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
